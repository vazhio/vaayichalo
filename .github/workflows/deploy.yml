name: Fetch texts and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the text fetcher
        working-directory: tools
        run: npm install --no-audit --no-fund

      - name: Download any missing texts from Malayalam Wikisource
        run: node tools/fetch-texts.mjs

      - name: Save the downloaded texts in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/texts tools/fetch-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Add texts downloaded from Malayalam Wikisource"
            git push
          fi

      - name: Remove build-only files
        run: rm -rf tools/node_modules

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
